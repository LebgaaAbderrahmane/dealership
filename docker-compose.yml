services:
  mysql:
    image: mysql:8.4
    container_name: apex-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: apex
      MYSQL_USER: apex
      MYSQL_PASSWORD: apex
    ports:
      - '3306:3306'
    volumes:
      - apex_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  apex_mysql_data:
